name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run conformance -- examples/sample.anx ANX-C3
      - name: Reference CLI smoke
        run: |
          mkdir -p output
          node dist/cli.js pack examples/sample.document.json output/sample.anx
          node dist/cli.js validate output/sample.anx > /dev/null
          node dist/cli.js migrate examples/sample.agn output/migrated.anx
          node dist/cli.js outline output/migrated.anx 5 > /dev/null
